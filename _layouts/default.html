<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
</head>
<body>

  <a class="skip-link" href="#main-content">Skip to main content</a>

  <nav class="topnav" aria-label="Primary navigation">
    <div class="nav-inner">
      <a class="nav-brand" href="{{ '/' | relative_url }}">RE</a>
      <div class="nav-links" id="primary-navigation">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active" aria-current="page"{% endif %}>Home</a>
        <a href="{{ '/current_status' | relative_url }}" {% if page.url contains 'current_status' %}class="active" aria-current="page"{% endif %}>Current Work</a>
        <a href="{{ '/academic_experience' | relative_url }}" {% if page.url contains 'academic_experience' %}class="active" aria-current="page"{% endif %}>Academic</a>
        <a href="{{ '/industry_experience' | relative_url }}" {% if page.url contains 'industry_experience' %}class="active" aria-current="page"{% endif %}>Industry</a>
        <a href="{{ '/education' | relative_url }}" {% if page.url contains 'education' %}class="active" aria-current="page"{% endif %}>Education</a>
        <a href="{{ '/publications' | relative_url }}" {% if page.url contains 'publications' %}class="active" aria-current="page"{% endif %}>Publications</a>
        <a href="{{ '/Presentations_Contributions' | relative_url }}" {% if page.url contains 'Presentations' %}class="active" aria-current="page"{% endif %}>Talks</a>
        <a href="{{ '/skills' | relative_url }}" {% if page.url contains 'skills' %}class="active" aria-current="page"{% endif %}>Skills</a>
        <a href="{{ '/blog' | relative_url }}" {% if page.url contains 'blog' or page.collection == 'posts' %}class="active" aria-current="page"{% endif %}>Notes</a>
        <a href="{{ '/assets/Rasika_Edirisinghe-CV.pdf' | relative_url }}" target="_blank" rel="noopener noreferrer" class="nav-cv">CV</a>
      </div>
      <button class="nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="primary-navigation">&#9776;</button>
    </div>
  </nav>

  <main class="page-content" id="main-content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>&copy; {{ site.time | date: '%Y' }} Rasika Edirisinghe &middot; MSCA Doctoral Researcher &middot; University College Cork</span>
      <div class="footer-links">
        <a href="https://www.linkedin.com/in/rasikaedirisinghe/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        <a href="https://github.com/mrHendrixSL/" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a href="https://orcid.org/0009-0008-4673-0259" target="_blank" rel="noopener noreferrer">ORCID</a>
        <a href="https://scholar.google.com/citations?user=o_7ZjgMAAAAJ&amp;hl=en" target="_blank" rel="noopener noreferrer">Scholar</a>
      </div>
    </div>
  </footer>

  <script>
    const navToggle = document.querySelector('.nav-toggle');
    const navLinks = document.querySelector('.nav-links');

    function setMenuState(open) {
      navLinks.classList.toggle('open', open);
      navToggle.setAttribute('aria-expanded', String(open));
      navToggle.setAttribute('aria-label', open ? 'Close navigation' : 'Open navigation');
    }

    navToggle.addEventListener('click', function() {
      setMenuState(navToggle.getAttribute('aria-expanded') !== 'true');
    });

    navLinks.addEventListener('click', function(event) {
      if (event.target.closest('a')) setMenuState(false);
    });

    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape' && navToggle.getAttribute('aria-expanded') === 'true') {
        setMenuState(false);
        navToggle.focus();
      }
    });

    window.matchMedia('(min-width: 921px)').addEventListener('change', function(event) {
      if (event.matches) setMenuState(false);
    });
  </script>

</body>
</html>
